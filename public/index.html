<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Python IDE</title>
  <link rel="stylesheet" href="styles.css" />

  <!-- Font Awesome (free) -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css"
  />

  <!-- Monaco Editor loader -->
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs/loader.js"></script>
  <!-- Pyodide -->
  <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
</head>
<body>
  <div class="ide">
    <!-- Header / Toolbar -->
    <header class="toolbar">
      <span class="logo">
        <i class="fa-brands fa-python logo-icon"></i>
        Minimal Python IDE
      </span>

      <div class="actions">
        <button id="run-btn" title="Run (Ctrl+Enter)">
          <i class="fa-solid fa-play"></i><span>Run</span>
        </button>
        <button id="stop-btn" title="Stop execution" disabled>
          <i class="fa-solid fa-stop"></i><span>Stop</span>
        </button>
        <button id="install-btn" title="Install a package with micropip">
          <i class="fa-solid fa-download"></i><span>Install</span>
        </button>
        <button id="clear-btn" title="Clear terminal">
          <i class="fa-solid fa-broom"></i><span>Clear</span>
        </button>
        <a href="app.html" class="help-link" title="Help & limitations">
          <i class="fa-solid fa-circle-question"></i>
        </a>
      </div>
    </header>

    <!-- Editor area -->
    <div class="editor-container">
      <div id="editor"></div>
    </div>

    <!-- Terminal area -->
    <div class="terminal-container">
      <div class="terminal-header">
        <span class="terminal-title">
          <i class="fa-solid fa-terminal"></i> Terminal
        </span>
        <span id="status" class="status">
          <i class="fa-solid fa-circle status-dot"></i>
          <span id="status-text">Ready</span>
        </span>
      </div>
      <pre id="terminal" class="terminal-output"></pre>
    </div>
  </div>

  <script>
    /* ------------------------------------------------------------------ */
    /* 1. Monaco Editor setup                                              */
    /* ------------------------------------------------------------------ */
    require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.45.0/min/vs' } });

    let editor;

    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('editor'), {
        value: `# Welcome to the Minimal Python IDE\n# Write Python 3 code below and press Run.\n\nprint("Hello, World!")\n`,
        language: 'python',
        theme: 'vs-dark',
        minimap: { enabled: false },
        automaticLayout: true,
        fontSize: 14,
        lineNumbers: 'on',
        tabSize: 4,
        renderWhitespace: 'selection',
      });

      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.Enter, () => {
        runCode();
      });
    });

    /* ------------------------------------------------------------------ */
    /* 2. Pyodide loading and stream redirection                           */
    /* ------------------------------------------------------------------ */
    let pyodide = null;
    let pyodideReady = false;
    let isRunning = false;

    const terminalEl = document.getElementById('terminal');
    const statusEl   = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const runBtn     = document.getElementById('run-btn');
    const stopBtn    = document.getElementById('stop-btn');

    function setStatus(text, state = 'ready') {
      statusText.textContent = text;
      statusEl.classList.remove('status-ready', 'status-busy', 'status-error');
      statusEl.classList.add('status-' + state);
    }

    function stripAnsi(str) {
      return str.replace(/\x1B\[[0-9;]*[A-Za-z]/g, '');
    }

    function appendToTerminal(text, type = 'output') {
      if (!text) return;
      const clean = stripAnsi(text);
      const span = document.createElement('span');
      if (type === 'error') span.className = 'term-error';
      else if (type === 'info') span.className = 'term-info';
      span.textContent = clean;
      terminalEl.appendChild(span);
      terminalEl.scrollTop = terminalEl.scrollHeight;
    }

    function clearTerminal() {
      terminalEl.textContent = '';
      appendToTerminal('Python IDE ready.\n', 'info');
    }

    (async function initPyodide() {
      try {
        appendToTerminal('Loading Python runtime…\n', 'info');
        setStatus('Loading…', 'busy');

        pyodide = await loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.26.2/full/',
        });

        // NOTE: batched() fires once per line and strips the trailing newline,
        // so we add it back here.
        pyodide.setStdout({ batched: (msg) => appendToTerminal(msg + '\n') });
        pyodide.setStderr({ batched: (msg) => appendToTerminal(msg + '\n', 'error') });
        pyodide.setStdin({ stdin: () => prompt('Input:') || '' });

        pyodideReady = true;
        setStatus('Python ready', 'ready');
        appendToTerminal('Python runtime loaded.\n', 'info');
      } catch (err) {
        setStatus('Load failed', 'error');
        appendToTerminal('Failed to load Pyodide: ' + err.message + '\n', 'error');
      }
    })();

    /* ------------------------------------------------------------------ */
    /* 3. Run / Stop / Install / Clear                                     */
    /* ------------------------------------------------------------------ */
    async function runCode() {
      if (!pyodideReady || isRunning || !editor) return;

      const code = editor.getValue();
      if (!code.trim()) {
        appendToTerminal('Nothing to run.\n', 'info');
        return;
      }

      clearTerminal();
      isRunning = true;
      runBtn.disabled = true;
      stopBtn.disabled = false;
      setStatus('Running…', 'busy');

      try {
        await pyodide.runPythonAsync(code);
        appendToTerminal('\n[Finished]\n', 'info');
        setStatus('Finished', 'ready');
      } catch (err) {
        appendToTerminal('\n' + err.message + '\n', 'error');
        setStatus('Error', 'error');
      } finally {
        isRunning = false;
        runBtn.disabled = false;
        stopBtn.disabled = true;
      }
    }

    function stopExecution() {
      if (!isRunning) return;
      isRunning = false;
      runBtn.disabled = false;
      stopBtn.disabled = true;
      setStatus('Stopped', 'ready');
      appendToTerminal('\n[Execution interrupted]\n', 'info');
    }

    async function installPackage() {
      if (!pyodideReady) {
        appendToTerminal('Python runtime is still loading…\n', 'info');
        return;
      }
      const pkg = prompt('Package name to install (e.g. numpy, requests, beautifulsoup4):');
      if (!pkg) return;

      appendToTerminal(`Installing "${pkg}"…\n`, 'info');
      setStatus('Installing…', 'busy');

      try {
        await pyodide.loadPackage('micropip');
        await pyodide.runPythonAsync(`
import micropip
await micropip.install("${pkg}")
`);
        appendToTerminal(`"${pkg}" installed successfully.\n`, 'info');
        setStatus('Package installed', 'ready');
      } catch (err) {
        appendToTerminal(`Installation failed: ${err.message}\n`, 'error');
        setStatus('Install failed', 'error');
      }
    }

    /* ------------------------------------------------------------------ */
    /* 4. Wire up UI                                                       */
    /* ------------------------------------------------------------------ */
    runBtn.addEventListener('click', runCode);
    stopBtn.addEventListener('click', stopExecution);
    document.getElementById('install-btn').addEventListener('click', installPackage);
    document.getElementById('clear-btn').addEventListener('click', clearTerminal);

    clearTerminal();
  </script>
</body>
</html>
